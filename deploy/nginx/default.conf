# 小信运维助手 (opshelper) edge routing.
#   /gateway/*  -> Next.js web (chat UI + admin)
#   /v1/*       -> Fastify API
#   /health     -> Fastify API
#   /           -> redirect to /gateway/chat

# Log paths without query strings or referrers, which may contain desktop tokens.
log_format opshelper '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

server {
  listen 80;
  server_name _;
  access_log /dev/stdout opshelper;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $opshelper_web http://web:3000;
  set $opshelper_api http://api:4000;

  # Allow large uploads through to the API/opencode.
  client_max_body_size 200m;

  # 反向代理（尤其经非 80 端口，如外层 :8080）场景：让 nginx 发「相对」重定向，
  # 不要把外层端口替换成自身监听的 80，否则 / -> /gateway/chat 这类跳转会丢掉
  # 外层端口、把用户甩到 :80。
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  location = / {
    return 302 /gateway/chat;
  }

  # Match the base path and its children; Next.js owns trailing-slash redirects.
  location ~ ^/gateway(?:/|$) {
    proxy_pass $opshelper_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ~ ^/v1/conversations/[^/]+/events$ {
    proxy_pass $opshelper_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
  }

  location /v1/ {
    proxy_pass $opshelper_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass $opshelper_api;
  }
}
