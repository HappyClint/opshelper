services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opshelper
      POSTGRES_PASSWORD: ${UPGRADE_TEST_PASSWORD:?required}
      POSTGRES_DB: opshelper
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshelper -d opshelper"]
      interval: 1s
      retries: 60
  fixture:
    image: node:22-bookworm-slim
    command: ["node", "/fixture/fixture-server.mjs"]
    volumes:
      - ${UPGRADE_REPO:?required}/scripts/runtime-upgrade:/fixture:ro
  api:
    image: ${UPGRADE_API_IMAGE:-opshelper/opencode-upgrade-api:validation}
    environment: &api-env
      DATABASE_URL: postgresql://opshelper:${UPGRADE_TEST_PASSWORD}@postgres:5432/opshelper
      DATA_ROOT: /data
      DATA_ROOT_HOST: ${UPGRADE_DATA:?required}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      OPENCODE_DOCKER_IMAGE: ${UPGRADE_RUNTIME_IMAGE:-opshelper/opencode-runtime:1.18.34}
      OPSHELPER_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}-default
      OPSHELPER_EXECUTION_POLL_MS: 250
      OPSHELPER_SCHEDULE_POLL_MS: 500
      OPSHELPER_IDLE_TIMEOUT_MINUTES: 60
      OPSHELPER_ADMIN_PASSWORD: ${UPGRADE_TEST_PASSWORD}
    volumes:
      - ${UPGRADE_DATA}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    image: opshelper/opencode-upgrade-worker:validation
    environment: *api-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  web:
    image: opshelper/opencode-upgrade-web:validation
    environment:
      OPSHELPER_API_INTERNAL_URL: http://api:4000
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${UPGRADE_TEST_PORT:-4340}:80"
    volumes:
      - ${UPGRADE_REPO}/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - default
      - edge
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-default
    internal: true
  edge:
volumes:
  pg:
